[project]
name = "momentum-ops"
version = "0.2.0"
description = "Low-latency asynchronous stock market momentum ingestion using Prefect and TimescaleDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.1",
    "asyncpg>=0.30.0",
    "prefect>=3.1.0",
    "pydantic-settings>=2.7.1",
    "pandas>=2.2.3",
    "pytz>=2024.2",
    "yfinance>=0.2.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.2",
    "black>=24.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
